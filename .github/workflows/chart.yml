name: Update ProvChart README SVGs

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  update-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Check secret is non-empty
        env:
          KEY: ${{ secrets.PROVCHART_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secrets.PROVCHART_API_KEY is empty for this repo"
            echo "Create a Repository secret named exactly PROVCHART_API_KEY"
            exit 1
          fi
          echo "Secret length: ${#KEY} (OK, value not printed)"
      - name: Generate Chart SVGs
        uses: fscss-ttr/provchart-readme-action@v1.0.3
        with:
          api-key: ${{ secrets.PROVCHART_API_KEY }}
          config: '.provchart/charts.json'
          output-dir: 'docs/charts'

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update provchart SVG [skip ci]"
          file_pattern: 'docs/charts/*.svg'
